name: Release Build

on:
  pull_request:
    paths:
      - 'go/Dockerfile'
      - 'deploy/release/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:
    inputs:
      phorge_ref:
        description: 'Matching published Phorge commit SHA (40 characters)'
        required: false

permissions:
  contents: read

env:
  PHORGE_REF: ${{ inputs.phorge_ref || vars.PHORGE_CONTRACT_REF }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  multiarch:
    name: Build ${{ matrix.service }} for AMD64 and ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gorge-render
            port: 8140
          - service: gorge-image
            port: 8190
    steps:
      - uses: actions/checkout@v6
        with:
          path: gorge
      - name: Require immutable paired Phorge revision
        run: '[[ "$PHORGE_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          repository: soulteary/phorge
          ref: ${{ env.PHORGE_REF }}
          path: phorge-fork
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Test release gate rejection paths
        run: python3 -m unittest discover -s gorge/deploy/release -p '*_test.py'
      - name: Verify locked base and fixture platforms
        id: bases
        run: python3 gorge/deploy/release/base_images.py --lock phorge-fork/deploy/acceptance/build-lock.json --github-output "$GITHUB_OUTPUT"
      - name: Build both architectures without publishing images
        uses: docker/build-push-action@v6
        with:
          context: gorge/go
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          push: false
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
            GO_BASE_IMAGE=${{ steps.bases.outputs.go_image }}
            RUNTIME_BASE_IMAGE=${{ steps.bases.outputs.alpine_image }}
          cache-from: type=gha,scope=release-smoke-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-smoke-${{ matrix.service }}
