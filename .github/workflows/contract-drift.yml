name: Contract drift (gorge ↔ phorge-fork)

# The anti-drift guard for the whole glue layer. go/internal/contracts/manifest.go
# is the machine-readable register of every wire field, HTTP route and error code
# that gorge (Go structs/routes/constants) and phorge-fork (PHP string literals)
# must spell identically; go/internal/doccheck/contractsync_test.go proves the two
# sides still agree. Rename one spelling on either side and nothing errors at
# runtime — a field just quietly goes empty or a document becomes unfindable
# (compat/phorge/README.md calls this "静默失效"). This job turns that silent
# drift into a red check.
#
# The same test also runs single-repo in the Documentation Consistency workflow
# (go test ./internal/doccheck), where PHORGE_FORK_DIR is unset and the
# cross-repo half t.Skip()s — so a lone gorge clone stays green. This workflow is
# where the cross-repo half actually executes, because only here is phorge-fork
# checked out and PHORGE_FORK_DIR pointed at it.
#
# Cross-repo refs are inputs (mirroring db-api-cross-repo.yml): a change here or
# in phorge-fork can not name a branch in the other repo, so defaults are the
# mainlines and a real paired rename is verified by dispatching with both refs.

on:
  workflow_dispatch:
    inputs:
      gorge_ref:
        description: 'gorge branch/tag/SHA to test'
        required: false
        default: 'main'
      phorge_ref:
        description: 'phorge-fork branch/tag/SHA to test'
        required: false
        default: 'main'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'go/internal/maintenance/**'
      - 'go/cmd/gorge-maintenance/**'
      - 'go/internal/contracts/**'
      - 'go/internal/doccheck/**'
      - 'go/internal/mailer/**'
      - 'go/internal/search/**'
      - 'go/internal/webhook/**'
      - 'go/internal/taskqueue/**'
      - 'go/internal/dbapi/**'
      - 'compat/phorge/**'
      - 'README.md'
      - 'docs/**'
      - 'deploy/compose/**'
      - 'api/openapi/**'
      - '.github/workflows/contract-drift.yml'
  push:
    branches: [ main ]
    paths:
      - 'go/internal/maintenance/**'
      - 'go/cmd/gorge-maintenance/**'
      - 'go/internal/contracts/**'
      - 'go/internal/doccheck/**'
      - 'go/internal/mailer/**'
      - 'go/internal/search/**'
      - 'go/internal/webhook/**'
      - 'go/internal/taskqueue/**'
      - 'go/internal/dbapi/**'
      - 'compat/phorge/**'
      - 'README.md'
      - 'docs/**'
      - 'deploy/compose/**'
      - 'api/openapi/**'
      - '.github/workflows/contract-drift.yml'

permissions:
  contents: read

env:
  # The paired phorge-fork ref: the input on dispatch, else main (a PR/push here
  # can not name a branch in phorge-fork). GORGE_REF falls back to the pushed
  # commit on push and the input otherwise.
  PHORGE_REF: ${{ github.event.inputs.phorge_ref || 'main' }}
  GORGE_REF: ${{ github.event.inputs.gorge_ref || github.sha }}
  PHORGE_REPO: soulteary/phorge

jobs:
  drift:
    name: Manifest agrees with phorge-fork literals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gorge
        uses: actions/checkout@v6
        with:
          ref: ${{ env.GORGE_REF }}
          path: gorge

      - name: Checkout phorge-fork
        uses: actions/checkout@v6
        with:
          repository: ${{ env.PHORGE_REPO }}
          ref: ${{ env.PHORGE_REF }}
          path: phorge-fork

      - name: Record refs under test
        run: |
          {
            echo "### contract-drift refs"
            echo "- gorge:       \`$(git -C gorge rev-parse HEAD)\`"
            echo "- phorge-fork: \`$(git -C phorge-fork rev-parse HEAD)\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: gorge/go/go.mod
          cache-dependency-path: gorge/go/go.sum

      # PHORGE_FORK_DIR is an absolute path into the sibling checkout above. With
      # it set, TestManifestMatchesPhorgeFork runs (instead of skipping) and
      # fails, naming the exact PHP file to edit, if any manifested field/route/
      # error code has drifted from its phorge-fork literal.
      - name: Contract drift check (manifest ↔ phorge-fork)
        working-directory: gorge/go
        env:
          PHORGE_FORK_DIR: ${{ github.workspace }}/phorge-fork
        run: go test ./internal/doccheck -count=1 -v

  cleanup:
    name: Cleanup paired PHP export and MySQL contracts
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gorge-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pgorge-contract-only" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GORGE_REF }}
          path: gorge
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PHORGE_REPO }}
          ref: ${{ env.PHORGE_REF }}
          path: phorge-fork
      - uses: actions/checkout@v6
        with:
          repository: phorgeit/arcanist
          ref: 6f3726694752fb9cb08207070a4d7f68163784e1
          path: arcanist
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
      - uses: actions/setup-go@v6
        with:
          go-version-file: gorge/go/go.mod
          cache-dependency-path: gorge/go/go.sum
      - name: Execute PHP guard and export actual policies
        working-directory: phorge-fork
        env:
          GORGE_TEST_ARCANIST_DIR: ${{ github.workspace }}/arcanist
          GORGE_TEST_MYSQL_PORT: '3306'
          GORGE_TEST_MYSQL_PASSWORD: gorge-contract-only
          GORGE_TEST_CLEANUP_EXPORT: ${{ runner.temp }}/cleanup-export.json
        run: php tests/contract/cleanup/runtime.php
      - name: Execute paired Go contracts without skipped fixtures
        working-directory: gorge/go
        env:
          PHORGE_FORK_DIR: ${{ github.workspace }}/phorge-fork
          GORGE_TEST_CLEANUP_EXPORT: ${{ runner.temp }}/cleanup-export.json
          GORGE_TEST_MYSQL_DSN: root:gorge-contract-only@tcp(127.0.0.1:3306)/
        run: |
          test -s "$GORGE_TEST_CLEANUP_EXPORT"
          test -f "$PHORGE_FORK_DIR/resources/sql/autopatches/20261006.cache.01.gorgecleanup.sql"
          go test -race -count=1 -v ./internal/maintenance/... ./cmd/gorge-maintenance
