name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]-r[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag for a manual build from main (e.g. latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # One image per binary under go/cmd. Adding a service means adding one
    # entry here; the Dockerfile and build context stay the same.
    #
    # The entry carries a port as well as a name because the shared Dockerfile
    # bakes ARG PORT into ENV GORGE_HEALTHCHECK_PORT, which its built-in
    # HEALTHCHECK reads at runtime. Left at the Dockerfile's 8140 default, an
    # image whose service listens elsewhere probes a port nothing binds and
    # reports unhealthy forever under plain `docker run`. Compose hides this,
    # since deploy/compose/docker-compose.yml overrides the healthcheck, so
    # the port has to be right here or the published image is wrong in a way
    # local testing will not surface.
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # port is the listener the image's built-in HEALTHCHECK probes.
          - service: gorge-render
            tag_prefix: render
            port: 8140
          # gorge-notification listens on two ports; 22281 is the admin one.
          - service: gorge-notification
            tag_prefix: notification
            port: 22281
          - service: gorge-mailer
            tag_prefix: mailer
            port: 8110
          - service: gorge-search
            tag_prefix: search
            port: 8120
          - service: gorge-file-storage
            tag_prefix: file-storage
            port: 8100
          # gorge-webhook's listener is status only — its work is a background
          # loop — so a healthcheck on this port says nothing about whether it
          # is delivering anything. See the compose service's comment.
          - service: gorge-webhook
            tag_prefix: webhook
            port: 8160
          - service: gorge-conduit
            tag_prefix: conduit
            port: 8150
          - service: gorge-taskqueue
            tag_prefix: taskqueue
            port: 8090
          # gorge-worker's listener is status only, like gorge-webhook's — its
          # work is a lease loop against gorge-taskqueue — so this port's
          # healthcheck is liveness, not a statement about whether it is
          # processing anything. See the compose service's comment.
          - service: gorge-worker
            tag_prefix: worker
            port: 8170
          # gorge-db-api reports on Phorge's MySQL cluster; its listener answers
          # /api/db/** read-only. It retains the pre-monorepo :8080.
          - service: gorge-db-api
            tag_prefix: db-api
            port: 8080
          # Signed Gitea webhooks are translated into Maniphest comments. The
          # bridge is one-way and does not own user identities.
          - service: gorge-gitea
            tag_prefix: gitea
            port: 8180

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # A manual release always publishes the current main branch, even if
          # the workflow was dispatched while viewing another ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # All service images live in the repository-owned `gorge` package.
          # The service prefix keeps their manifests independent inside that
          # package: `render-latest`, `search-2026.09.08-r5`, and so on.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}-${{ github.ref_name }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ matrix.tag_prefix }}-latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ matrix.tag_prefix }}-${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.service }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: go
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
