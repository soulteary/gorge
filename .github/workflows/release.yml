name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest, v1.0.0)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # One image per binary under go/cmd. Adding a service means adding one
    # entry here; the Dockerfile and build context stay the same.
    #
    # The entry carries a port as well as a name because the shared Dockerfile
    # bakes ARG PORT into ENV GORGE_HEALTHCHECK_PORT, which its built-in
    # HEALTHCHECK reads at runtime. Left at the Dockerfile's 8140 default, an
    # image whose service listens elsewhere probes a port nothing binds and
    # reports unhealthy forever under plain `docker run`. Compose hides this,
    # since deploy/compose/docker-compose.yml overrides the healthcheck, so
    # the port has to be right here or the published image is wrong in a way
    # local testing will not surface.
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # port is the listener the image's built-in HEALTHCHECK probes.
          - service: gorge-render
            port: 8140
          # gorge-notification listens on two ports; 22281 is the admin one.
          - service: gorge-notification
            port: 22281
          - service: gorge-mailer
            port: 8110
          - service: gorge-search
            port: 8120

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: go
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
