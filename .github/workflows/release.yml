name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]-r[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (YYYY.MM.DD-rN)'
        required: true
      phorge_ref:
        description: 'Matching published Phorge commit SHA (40 characters)'
        required: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  REQUESTED_PHORGE_REF: ${{ inputs.phorge_ref }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-pair:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      gorge_sha: ${{ steps.revision.outputs.sha }}
      phorge_sha: ${{ steps.revision.outputs.phorge }}
      go_image: ${{ steps.revision.outputs.go_image }}
      alpine_image: ${{ steps.revision.outputs.alpine_image }}
      service_matrix: ${{ steps.revision.outputs.service_matrix }}
    steps:
      - name: Require a version and exact published pair
        run: |
          [[ "$RELEASE_TAG" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}-r[0-9]+$ ]]
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: gorge
      - name: Resolve the tag-owned immutable security pair
        id: pair
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git -C gorge rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'gorge/deploy/release')
          from registry_metadata import identity
          identity(os.environ['GITHUB_REPOSITORY'], os.environ['RELEASE_TAG'], os.environ['GITHUB_SHA'], os.environ['GITHUB_REF'])
          PY
          phorge_sha="$(python3 gorge/deploy/release/source_pair.py --lock gorge/deploy/release/source-pair.json --tag "$RELEASE_TAG" --requested "$REQUESTED_PHORGE_REF")"
          echo "phorge=$phorge_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: soulteary/phorge
          ref: ${{ steps.pair.outputs.phorge }}
          path: phorge-fork
      - name: Verify the effective paired PHP security baseline
        run: python3 gorge/deploy/release/source_pair.py --verify-php phorge-fork
      - id: revision
        run: |
          echo "sha=$(git -C gorge rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "phorge=$(git -C phorge-fork rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path
          sys.path.insert(0, 'gorge/deploy/release')
          from base_images import load_lock
          images=load_lock(Path('phorge-fork/deploy/acceptance/build-lock.json'), Path('gorge/deploy/release/build-bases.json'))['images']
          print('go_image='+images['go'])
          print('alpine_image='+images['alpine'])
          from manifest import SERVICES
          import json
          print('service_matrix='+json.dumps(list(SERVICES)))
          PY
      - uses: actions/setup-go@v6
        with:
          go-version-file: gorge/go/go.mod
          cache-dependency-path: gorge/go/go.sum
      - name: Require portable locked base and fixture images
        run: python3 gorge/deploy/release/base_images.py --lock phorge-fork/deploy/acceptance/build-lock.json --build-bases gorge/deploy/release/build-bases.json
      - name: Verify the cross-repository contract before building
        working-directory: gorge/go
        env:
          PHORGE_FORK_DIR: ${{ github.workspace }}/phorge-fork
        run: |
          go test -count=1 ./internal/doccheck ./cmd/...
          go vet ./...
      - name: Test release gate rejection paths
        working-directory: gorge
        run: python3 -m unittest discover -s deploy/release -p '*_test.py'

  candidates:
    needs: validate-pair
    # One image per binary under go/cmd. Adding a service means adding one
    # entry here; the Dockerfile and build context stay the same.
    #
    # The entry carries a port as well as a name because the shared Dockerfile
    # bakes ARG PORT into ENV GORGE_HEALTHCHECK_PORT, which its built-in
    # HEALTHCHECK reads at runtime. Left at the Dockerfile's 8140 default, an
    # image whose service listens elsewhere probes a port nothing binds and
    # reports unhealthy forever under plain `docker run`. Compose hides this,
    # since deploy/compose/docker-compose.yml overrides the healthcheck, so
    # the port has to be right here or the published image is wrong in a way
    # local testing will not surface.
    name: Candidate ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # port is the listener the image's built-in HEALTHCHECK probes.
          - service: gorge-integrations
            tag_prefix: integrations
            port: 8210
          - service: gorge-maintenance
            tag_prefix: maintenance
            port: 8200
          - service: gorge-image
            tag_prefix: image
            port: 8190
          - service: gorge-render
            tag_prefix: render
            port: 8140
          # gorge-notification listens on two ports; 22281 is the admin one.
          - service: gorge-notification
            tag_prefix: notification
            port: 22281
          - service: gorge-mailer
            tag_prefix: mailer
            port: 8110
          - service: gorge-search
            tag_prefix: search
            port: 8120
          - service: gorge-file-storage
            tag_prefix: file-storage
            port: 8100
          # gorge-webhook's listener is status only — its work is a background
          # loop — so a healthcheck on this port says nothing about whether it
          # is delivering anything. See the compose service's comment.
          - service: gorge-webhook
            tag_prefix: webhook
            port: 8160
          - service: gorge-conduit
            tag_prefix: conduit
            port: 8150
          - service: gorge-taskqueue
            tag_prefix: taskqueue
            port: 8090
          # gorge-worker's listener is status only, like gorge-webhook's — its
          # work is a lease loop against gorge-taskqueue — so this port's
          # healthcheck is liveness, not a statement about whether it is
          # processing anything. See the compose service's comment.
          - service: gorge-worker
            tag_prefix: worker
            port: 8170
          # gorge-db-api reports on Phorge's MySQL cluster; its listener answers
          # /api/db/** read-only. It retains the pre-monorepo :8080.
          - service: gorge-db-api
            tag_prefix: db-api
            port: 8080
          # Signed Gitea webhooks are translated into Maniphest comments. The
          # bridge is one-way and does not own user identities.
          - service: gorge-gitea
            tag_prefix: gitea
            port: 8180

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pair.outputs.gorge_sha }}
          path: gorge

      - name: Enable ARM64 build steps
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: gorge/go
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
            GO_BASE_IMAGE=${{ needs.validate-pair.outputs.go_image }}
            RUNTIME_BASE_IMAGE=${{ needs.validate-pair.outputs.alpine_image }}
          push: true
          # Candidate tags never move any published release or latest pointer.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag_prefix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.revision=${{ needs.validate-pair.outputs.gorge_sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
      - name: Record the immutable candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE_NAME: ${{ matrix.tag_prefix }}
          SERVICE_PORT: ${{ matrix.port }}
          GORGE_SHA: ${{ needs.validate-pair.outputs.gorge_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['SERVICE_NAME']+'.json').write_text(json.dumps({
              'name': os.environ['SERVICE_NAME'], 'port': int(os.environ['SERVICE_PORT']),
              'digest': os.environ['CANDIDATE_DIGEST'], 'gorgeCommit': os.environ['GORGE_SHA']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.tag_prefix }}
          path: ${{ matrix.tag_prefix }}.json
          if-no-files-found: error

  paired-acceptance:
    needs: [validate-pair, candidates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pair.outputs.gorge_sha }}
          path: gorge
      - uses: actions/checkout@v6
        with:
          repository: soulteary/phorge
          ref: ${{ needs.validate-pair.outputs.phorge_sha }}
          path: phorge-fork
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind complete candidate digests
        env:
          GORGE_SHA: ${{ needs.validate-pair.outputs.gorge_sha }}
        run: |
          python3 gorge/deploy/release/manifest.py --candidates "$RUNNER_TEMP/candidates" \
            --repository "$REGISTRY/$IMAGE_NAME" --gorge-sha "$GORGE_SHA" \
            --output "$RUNNER_TEMP/candidate-images.json"
      - name: Execute mandatory paired real-backend acceptance
        run: |
          python3 phorge-fork/deploy/acceptance/accept.py --gorge-dir "$GITHUB_WORKSPACE/gorge" \
            --candidate-images "$RUNNER_TEMP/candidate-images.json" --output "$RUNNER_TEMP/acceptance"
      - name: Produce the verified release manifest
        env:
          GORGE_SHA: ${{ needs.validate-pair.outputs.gorge_sha }}
          PHORGE_SHA: ${{ needs.validate-pair.outputs.phorge_sha }}
        run: |
          python3 gorge/deploy/release/manifest.py --candidates "$RUNNER_TEMP/candidates" \
            --repository "$REGISTRY/$IMAGE_NAME" --gorge-sha "$GORGE_SHA" --phorge-sha "$PHORGE_SHA" \
            --tag "$RELEASE_TAG" --acceptance "$RUNNER_TEMP/acceptance/delivery-manifest.json" \
            --output "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-release-evidence
          path: |
            ${{ runner.temp }}/acceptance
            ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error

  sign-components:
    needs: [validate-pair, paired-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate-pair.outputs.service_matrix) }}
    concurrency:
      group: gorge-component-publication-${{ matrix.service }}
      cancel-in-progress: false
    env:
      SERVICE: ${{ matrix.service }}
      GORGE_SHA: ${{ needs.validate-pair.outputs.gorge_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: paired-release-evidence
          path: release-evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify accepted OCI source, version, packaging and immutable aliases
        id: preflight
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 deploy/release/component_images.py --repository "$IMAGE_NAME" --tag "$RELEASE_TAG" \
            --sha "$GORGE_SHA" --ref "$GITHUB_REF" --service "$SERVICE" \
            --manifest release-evidence/release-manifest.json --output "$RUNNER_TEMP/preflight.json" --github-output "$GITHUB_OUTPUT"
      - name: Create missing immutable aliases without replacing an existing publication
        if: steps.preflight.outputs.exists != 'true'
        env:
          ACCEPTED_DIGEST: ${{ steps.preflight.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$REGISTRY/$IMAGE_NAME:$SERVICE-$RELEASE_TAG" \
            --tag "$REGISTRY/$IMAGE_NAME:$SERVICE-sha-$GORGE_SHA" "$REGISTRY/$IMAGE_NAME@$ACCEPTED_DIGEST"
      - name: Verify published aliases still equal the accepted digest
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 deploy/release/component_images.py --repository "$IMAGE_NAME" --tag "$RELEASE_TAG" \
            --sha "$GORGE_SHA" --ref "$GITHUB_REF" --service "$SERVICE" --require-published \
            --manifest release-evidence/release-manifest.json --output "$RUNNER_TEMP/published.json"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign the exact paired-accepted component digest
        env:
          ACCEPTED_DIGEST: ${{ steps.preflight.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE_NAME@$ACCEPTED_DIGEST"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.preflight.outputs.digest }}
          push-to-registry: true
      - name: Verify signer identity, source revision and release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPTED_DIGEST: ${{ steps.preflight.outputs.digest }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$REGISTRY/$IMAGE_NAME@$ACCEPTED_DIGEST" > "$RUNNER_TEMP/cosign-verification-$SERVICE.json"
          gh attestation verify "oci://$REGISTRY/$IMAGE_NAME@$ACCEPTED_DIGEST" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GORGE_SHA" --source-ref "refs/tags/$RELEASE_TAG" \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/attestation-verification-$SERVICE.json"
          python3 deploy/release/signed_release.py record --published "$RUNNER_TEMP/published.json" \
            --cosign "$RUNNER_TEMP/cosign-verification-$SERVICE.json" --attestation "$RUNNER_TEMP/attestation-verification-$SERVICE.json" \
            --output "$RUNNER_TEMP/verified-$SERVICE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-component-${{ matrix.service }}
          path: |
            ${{ runner.temp }}/verified-${{ matrix.service }}.json
            ${{ runner.temp }}/cosign-verification-${{ matrix.service }}.json
            ${{ runner.temp }}/attestation-verification-${{ matrix.service }}.json
          if-no-files-found: error

  publish:
    needs: [validate-pair, paired-acceptance, sign-components]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The latest read, comparison, and promotion must share one lock across
    # every version; per-tag workflow locks alone allow older builds to win.
    concurrency:
      group: gorge-release-publication
      cancel-in-progress: false
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-pair.outputs.gorge_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: paired-release-evidence
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-component-*
          merge-multiple: true
          path: component-evidence
      - name: Require all fourteen exact verified signatures before publication
        env:
          GORGE_SHA: ${{ needs.validate-pair.outputs.gorge_sha }}
        run: |
          python3 deploy/release/signed_release.py assemble --manifest release-evidence/release-manifest.json \
            --directory component-evidence --repository "$IMAGE_NAME" --tag "$RELEASE_TAG" --sha "$GORGE_SHA" \
            --output release-evidence/signed-release-manifest.json
          mv release-evidence/signed-release-manifest.json release-evidence/release-manifest.json
      - name: Publish one complete release pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s release-evidence/release-manifest.json
          test -s RELEASE_NOTES.md
          cat RELEASE_NOTES.md > "$RUNNER_TEMP/release-body.txt"
          printf '\n%s\n' 'Deploy the exact paired commits and service digests in release-manifest.json. Independent service latest tags are not promoted.' >> "$RUNNER_TEMP/release-body.txt"
          python3 deploy/release/publish.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-body.txt" --manifest release-evidence/release-manifest.json

  report_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch published tag reports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
