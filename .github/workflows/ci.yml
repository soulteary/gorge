name: CI

# The Go module lives under go/, so every job runs with working-directory: go
# and the paths filter keeps PHP-only changes from spending CI minutes here.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'go/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'go/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  GO_VERSION: '1.27'

jobs:
  image-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Build and start real image backend
        run: |
          docker build --build-arg SERVICE=gorge-image --build-arg PORT=8190 -t gorge-image:test go
          docker run -d --name image-contract -p 18150:8190 -e GORGE_SERVICE_TOKEN=image-contract-only --memory=1g --read-only --tmpfs /tmp:rw,size=512m gorge-image:test
          for i in $(seq 1 30); do curl -fsS http://localhost:18150/readyz && exit 0; sleep 1; done
          docker logs image-contract
          exit 1
      - name: Codec and animation contracts
        working-directory: go
        env:
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18150
          GORGE_TEST_IMAGE_TOKEN: image-contract-only
        run: go test -race -count=1 ./internal/imagetransform
      - name: Remove test service
        if: always()
        run: docker rm -f image-contract || true
  # Code formatting check
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Check code formatting
        working-directory: go
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  # Code static analysis
  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Run go vet
        working-directory: go
        run: go vet ./...

  # Compilation check
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Build all packages
        working-directory: go
        run: go build ./...

  # Code testing
  test:
    name: Code Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test -v ./...

  # Code quality check (using golangci-lint)
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      # The action resolves the module itself, so it takes working-directory as
      # an input rather than honouring the shell-level one.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go
          args: --timeout=5m
          only-new-issues: false

  # Dependency security scan
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security scan
        working-directory: go
        run: govulncheck ./...

  queue-execution:
    name: Queue execution against real backends
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: execution-test-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pexecution-test-only" --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify leases, parent and children, and replay receipts
        working-directory: go
        env:
          GORGE_TEST_REDIS_ADDR: 127.0.0.1:6379
          GORGE_TEST_MYSQL_DSN: root:execution-test-only@tcp(127.0.0.1:3306)/
        run: go test ./internal/taskqueue -run 'TestExecution(Redis|MySQL)Integration' -v

  worker-lifecycle:
    name: Worker heartbeat and relay races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify ownership cancellation and relay replay
        working-directory: go
        run: go test -race ./internal/worker/...
