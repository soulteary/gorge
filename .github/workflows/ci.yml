name: CI

# The Go module lives under go/, so every job runs with working-directory: go
# and the paths filter keeps PHP-only changes from spending CI minutes here.
on:
  push:
    branches: [main, develop]
    paths:
      - 'Makefile'
      - 'go/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Makefile'
      - 'go/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  GO_VERSION: '1.27.2'

jobs:
  cleanup-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cleanup-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pcleanup-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify bounded cleanup and execution fencing
        working-directory: go
        env:
          GORGE_TEST_MYSQL_DSN: root:cleanup-contract-only@tcp(127.0.0.1:3306)/
        run: go test -race -count=1 ./internal/maintenance/cleanup

  search-projection-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: search-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -psearch-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          node.store.allow_mmap: 'false'
          ES_JAVA_OPTS: '-Xms256m -Xmx256m'
        ports: ['9200:9200']
      meilisearch:
        image: getmeili/meilisearch:v1.12.8
        env:
          MEILI_MASTER_KEY: search-contract-only
        ports: ['7700:7700']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Wait for Meilisearch
        run: curl --retry 30 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:7700/health
      - name: Wait for Elasticsearch
        run: curl --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS http://127.0.0.1:9200/
      - name: Verify durable acceptance and backend completion
        working-directory: go
        env:
          GORGE_TEST_SEARCH_MYSQL_DSN:
            root:search-contract-only@tcp(127.0.0.1:3306)/?timeout=5s&readTimeout=5s&writeTimeout=5s
          GORGE_TEST_ES_URL: http://127.0.0.1:9200
          GORGE_TEST_MEILI_URL: http://127.0.0.1:7700
          GORGE_TEST_MEILI_KEY: search-contract-only
        run: go test -race -count=1 ./internal/search/...
  image-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Build and start real image backend
        run: |
          docker build --build-arg SERVICE=gorge-image --build-arg PORT=8190 -t gorge-image:test go
          docker run -d --name image-contract -p 18150:8190 -e GORGE_SERVICE_TOKEN=image-contract-only --memory=1g --read-only --tmpfs /tmp:rw,size=512m gorge-image:test
          for i in $(seq 1 30); do curl -fsS http://localhost:18150/readyz && exit 0; sleep 1; done
          docker logs image-contract
          exit 1
      - name: Codec and animation contracts
        working-directory: go
        env:
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18150
          GORGE_TEST_IMAGE_TOKEN: image-contract-only
        run: go test -race -count=1 ./internal/imagetransform
      - name: Remove test service
        if: always()
        run: docker rm -f image-contract || true
  # Code formatting check
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Check code formatting
        working-directory: go
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  # Code static analysis
  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Run go vet
        working-directory: go
        run: go vet ./...

  # Compilation check
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Build all packages
        working-directory: go
        run: go build ./...

  # Code testing
  test:
    name: Code Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Run tests
        working-directory: go
        run: go test -v ./...

  # Code quality check (using golangci-lint)
        if: "!(github.event_name == 'pull_request' && runner.os == 'Linux')"
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: go
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: go
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request' && runner.os == 'Linux')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      # The action resolves the module itself, so it takes working-directory as
      # an input rather than honouring the shell-level one.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go
          args: --timeout=5m
          only-new-issues: false

  # Dependency security scan
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security scan
        working-directory: go
        run: govulncheck ./...

  queue-execution:
    name: Queue execution against real backends
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: execution-test-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pexecution-test-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify leases, atomic scheduler, parent and children, and replay receipts
        working-directory: go
        env:
          GORGE_TEST_REDIS_ADDR: 127.0.0.1:6379
          GORGE_TEST_MYSQL_DSN: root:execution-test-only@tcp(127.0.0.1:3306)/
        run: |
          go test ./internal/taskqueue -run 'TestExecution(Redis|MySQL)Integration' -v
          go test -race ./internal/mailer -run 'Test(MailDelivery|DeliveryInspection)MySQLIntegration' -v

  worker-lifecycle:
    name: Worker heartbeat and relay races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify ownership cancellation and relay replay
        working-directory: go
        run: go test -race ./internal/worker/...

  integrations-runtime:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integrations-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pintegrations-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Create disposable integration schema
        run: mysql -h127.0.0.1 -uroot -pintegrations-contract-only -e 'CREATE DATABASE gorge_integrations_test'
      - name: Verify effect, inbox and fact transaction contracts
        working-directory: go
        env:
          GORGE_TEST_INTEGRATIONS_DSN:
            root:integrations-contract-only@tcp(127.0.0.1:3306)/gorge_integrations_test?parseTime=true
        run: go test -race -count=1 ./internal/integrations ./cmd/gorge-integrations
