name: CI

# The Go module lives under go/, so every job runs with working-directory: go
# and job-level selection avoids expensive runtime jobs for documentation only.
# The final required check always runs, including documentation and report pushes.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27.4'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/governance/required_ci.py select

  policy:
    name: CI and release policy contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test required-check fail-closed paths
        run: python3 -m unittest discover -s .github/scripts/governance -p '*_test.py'
      - name: Set up PHP for release predicate tests
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.13'
          extensions: opcache
          coverage: none
      - name: Test immutable source-pair and release rejection paths
        run: python3 -m unittest discover -s deploy/release -p '*_test.py'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Verify documentation contracts even on documentation-only changes
        working-directory: go
        run: go test ./internal/doccheck

  cleanup-runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cleanup-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pcleanup-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify bounded cleanup and execution fencing
        working-directory: go
        env:
          GORGE_TEST_MYSQL_DSN: root:cleanup-contract-only@tcp(127.0.0.1:3306)/
        run: go test -race -count=1 ./internal/maintenance/cleanup

  search-projection-runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: search-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -psearch-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          node.store.allow_mmap: 'false'
          ES_JAVA_OPTS: '-Xms256m -Xmx256m'
        ports: ['9200:9200']
      meilisearch:
        image: getmeili/meilisearch:v1.58.0@sha256:cee0d2e31191594ff8e1651eb144aabd95b389a0bc3532327ecfb9ed91dffe7e
        env:
          MEILI_MASTER_KEY: search-contract-only
        ports: ['7700:7700']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Wait for Meilisearch
        run: curl --retry 30 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:7700/health
      - name: Wait for Elasticsearch
        run: curl --retry 60 --retry-delay 1 --retry-connrefused --retry-all-errors -fsS http://127.0.0.1:9200/
      - name: Verify durable acceptance and backend completion
        working-directory: go
        env:
          GORGE_TEST_SEARCH_MYSQL_DSN:
            root:search-contract-only@tcp(127.0.0.1:3306)/?timeout=5s&readTimeout=5s&writeTimeout=5s
          GORGE_TEST_ES_URL: http://127.0.0.1:9200
          GORGE_TEST_MEILI_URL: http://127.0.0.1:7700
          GORGE_TEST_MEILI_KEY: search-contract-only
        run: go test -race -count=1 ./internal/search/...
  image-runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Build and start real image backend
        run: |
          docker build --build-arg SERVICE=gorge-image --build-arg PORT=8190 -t gorge-image:test go
          docker run -d --name image-contract -p 18150:8190 -e GORGE_SERVICE_TOKEN=image-contract-only --memory=1g --read-only --tmpfs /tmp:rw,size=512m gorge-image:test
          for i in $(seq 1 30); do curl -fsS http://localhost:18150/readyz && exit 0; sleep 1; done
          docker logs image-contract
          exit 1
      - name: Codec and animation contracts
        working-directory: go
        env:
          GORGE_TEST_IMAGE_URL: http://127.0.0.1:18150
          GORGE_TEST_IMAGE_TOKEN: image-contract-only
        run: go test -race -count=1 ./internal/imagetransform
      - name: Remove test service
        if: always()
        run: docker rm -f image-contract || true
  # Code formatting check
  fmt:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Check code formatting
        working-directory: go
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  # Code static analysis
  vet:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Run go vet
        working-directory: go
        run: go vet ./...

  # Compilation check
  build:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Build all packages
        working-directory: go
        run: go build ./...

  # Code testing
  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Code Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Run tests
        if: "!(github.event_name == 'pull_request' && runner.os == 'Linux')"
        working-directory: go
        run: go test -v ./...

  # Code quality check (using golangci-lint)
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request' && runner.os == 'Linux')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          # Keep tracked report links available to documentation tests.
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.3)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89  # v1.1.3
        with:
          directory: go
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.3"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Go quality report (v1.1.3)
        if: "!cancelled() && (github.event_name == 'pull_request' && runner.os == 'Linux') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d  # v1.1.7
        with:
          directory: go
          version: "v1.1.7"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request' && runner.os == 'Linux'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  lint:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      # The action resolves the module itself, so it takes working-directory as
      # an input rather than honouring the shell-level one.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: go
          args: --timeout=5m
          only-new-issues: false

  # Dependency security scan
  security-scan:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go environment
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run security scan
        working-directory: go
        run: govulncheck ./...

  queue-execution:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Queue execution against real backends
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: execution-test-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pexecution-test-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify leases, atomic scheduler, parent and children, and replay receipts
        working-directory: go
        env:
          GORGE_TEST_REDIS_ADDR: 127.0.0.1:6379
          GORGE_TEST_MYSQL_DSN: root:execution-test-only@tcp(127.0.0.1:3306)/
        run: |
          go test ./internal/taskqueue -run 'TestExecution(Redis|MySQL)Integration' -v
          go test -race ./internal/mailer -run 'Test(MailDelivery|DeliveryInspection)MySQLIntegration' -v

  worker-lifecycle:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    name: Worker heartbeat and relay races
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum
      - name: Verify ownership cancellation and relay replay
        working-directory: go
        run: go test -race ./internal/worker/...

  integrations-runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integrations-contract-only
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -pintegrations-contract-only" --health-interval 5s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Create disposable integration schema
        run: mysql -h127.0.0.1 -uroot -pintegrations-contract-only -e 'CREATE DATABASE gorge_integrations_test'
      - name: Verify effect, inbox and fact transaction contracts
        working-directory: go
        env:
          GORGE_TEST_INTEGRATIONS_DSN:
            root:integrations-contract-only@tcp(127.0.0.1:3306)/gorge_integrations_test?parseTime=true
        run: go test -race -count=1 ./internal/integrations ./cmd/gorge-integrations

  identity-regression:
    name: Isolated identity and mail regression
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable fixtures and isolation rejection paths
        run: python3 -m unittest discover -s tests/identity -p '*_test.py'
      - name: Run fresh six-service contracts and restart recovery
        run: python3 tests/identity/run.py --output "$RUNNER_TEMP/identity-regression.json"
      - name: Upload only the sanitized source-bound receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/identity-regression.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Gorge required CI
    if: always()
    needs: [changes, policy, identity-regression, cleanup-runtime, search-projection-runtime, image-runtime, fmt, vet, build, test, lint, security-scan, queue-execution, worker-lifecycle, integrations-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: python3 .github/scripts/governance/required_ci.py verify
