# Gorge Go service layer.
#
#   cd deploy/compose && cp .env.example .env && docker compose up -d --build
#
# Build contexts point at ../../go because all binaries share one module and
# one Dockerfile; each service selects its binary through the SERVICE build arg.

name: gorge

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - gorge
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # --- render: syntax highlighting and diffs ---
  #
  # Two domains, one service. The diff domain answers /api/diff/* on this same
  # port; it has no service of its own because both domains are pure
  # computation with no external dependency, so a second container would only
  # add something else to deploy. Its former :8130 is retired.
  render:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-render
    image: ghcr.io/soulteary/gorge-render:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8140"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      GORGE_RENDER_MAX_BYTES: ${GORGE_RENDER_MAX_BYTES:-1048576}
      GORGE_DIFF_MAX_BYTES: ${GORGE_DIFF_MAX_BYTES:-1048576}
      GORGE_RENDER_TIMEOUT_SEC: ${GORGE_RENDER_TIMEOUT_SEC:-15}
    ports:
      - "${GORGE_RENDER_PORT:-8140}:8140"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8140/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- conduit: Conduit API reverse-proxy gateway ---
  #
  # The odd one out in this file, and in the whole layer: its consumer is other
  # Go services, not Phorge's PHP. Every other service here answers calls that
  # originate in Phorge; conduit sits in front of Phorge and answers calls that
  # go *to* it. It replaces the pattern of each Go service dialling Phorge's
  # `/api/*` directly, folding authentication, per-IP rate limiting and request
  # auditing into one gateway.
  #
  # It is stateless — the rate limiter's visitor table is in-memory and per
  # instance, nothing to persist — so the probe is /healthz, like render, not
  # /readyz. "Ready" here would mean nothing more than "listening": the gateway
  # never dials its upstream to decide it is up, so a probe that did would only
  # report whether Phorge is up, which is not this service's health.
  #
  # And, like file-storage's blob backend and webhook's database, its upstream
  # is not in this file. This compose is the Go service layer: there is no
  # phorge container here, so GORGE_CONDUIT_UPSTREAM_URL defaults to a host
  # (`phorge`) that does not resolve in a pure service-layer stack. Left at the
  # default the gateway comes up healthy and answers /healthz, but every
  # proxied /api/* call fails 502 — because there is nothing upstream to reach,
  # not because the service is broken. Point it at a real Phorge to make the
  # proxy path work; see .env.example.
  conduit:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-conduit
        PORT: 8150
    image: ghcr.io/soulteary/gorge-conduit:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8150"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      # The Phorge PHP app this gateway proxies to. No phorge container is
      # declared here, so the `phorge` default resolves to nothing in a pure
      # service-layer stack and every proxied call gets 502. Point it at a real
      # Phorge to turn the proxy path on.
      GORGE_CONDUIT_UPSTREAM_URL: ${GORGE_CONDUIT_UPSTREAM_URL:-http://phorge:80}
      # Per-client-IP token bucket. RPS 0 disables rate limiting entirely, which
      # is the default: turn it on by setting a positive value. BURST is the
      # bucket capacity, EXEMPT lists the Conduit methods that always pass
      # (health-probe and capability calls that should never be throttled).
      GORGE_CONDUIT_RATE_LIMIT_RPS: ${GORGE_CONDUIT_RATE_LIMIT_RPS:-0}
      GORGE_CONDUIT_RATE_LIMIT_BURST: ${GORGE_CONDUIT_RATE_LIMIT_BURST:-20}
      GORGE_CONDUIT_RATE_LIMIT_EXEMPT: ${GORGE_CONDUIT_RATE_LIMIT_EXEMPT:-conduit.ping,conduit.getcapabilities}
      # Upstream request timeout in seconds, and the largest request body the
      # gateway forwards before rejecting it.
      GORGE_CONDUIT_PROXY_TIMEOUT_SEC: ${GORGE_CONDUIT_PROXY_TIMEOUT_SEC:-30}
      GORGE_CONDUIT_MAX_BODY_SIZE: ${GORGE_CONDUIT_MAX_BODY_SIZE:-10M}
    ports:
      - "${GORGE_CONDUIT_PORT:-8150}:8150"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8150/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- gorge-notification: Aphlict-compatible notification server ---
  #
  # One process, two listeners. The split is not a choice: Phorge validates
  # notification.servers by requiring both an "admin" and a "client" entry and
  # rejecting a duplicate host:port pair, so the two roles cannot be folded
  # onto one port the way render and diff share :8140.
  #
  # This service has no token authentication, unlike render, and that is
  # deliberate. The client side speaks Aphlict's wire protocol to JX.Aphlict
  # running in the browser, which has no way to send a service token; adding
  # one would break wire compatibility. The admin port is therefore guarded by
  # network isolation only — see GORGE_NOTIFICATION_ADMIN_PORT in .env.example
  # before exposing it anywhere but a private network.
  gorge-notification:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-notification
        # PORT feeds ENV GORGE_HEALTHCHECK_PORT and nothing else; only the
        # image's built-in HEALTHCHECK reads it. Both listeners answer
        # /healthz, so point it at the admin port, which is plain HTTP. Left
        # at its 8140 default the probe would hit a port no listener here
        # binds and the container would restart in a loop.
        PORT: 22281
    image: ghcr.io/soulteary/gorge-notification:${GORGE_IMAGE_TAG:-latest}
    environment:
      # Bind address only; the ports below are separate settings. The service
      # keeps its 22280/22281 defaults because three places have to agree on
      # them: this mapping, the healthcheck, and the PORT build arg above.
      GORGE_NOTIFICATION_LISTEN_ADDR: "0.0.0.0"
      GORGE_NOTIFICATION_CONFIG_FILE: ${GORGE_NOTIFICATION_CONFIG_FILE:-}
    ports:
      # Host side is variable, in-container side is not. The client port has
      # to be published even when everything else stays on the gorge network:
      # Phorge hands the client URI to the browser, so the address must
      # resolve from the end user's machine, not just from a sibling
      # container.
      - "${GORGE_NOTIFICATION_CLIENT_PORT:-22280}:22280"
      - "${GORGE_NOTIFICATION_ADMIN_PORT:-22281}:22281"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:22281/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- gorge-mailer: outbound email ---
  #
  # A process of its own, unlike diff sharing render's. It is the opposite of
  # pure computation: it holds adapter state, it connects out to SMTP servers
  # and provider APIs, and it has a readiness condition worth reporting.
  #
  # The healthcheck probes /readyz rather than /healthz, and that difference is
  # the point of this service having one. /healthz answers 200 as soon as the
  # process is listening — including when no backend is configured at all,
  # which is the state where every message fails. /readyz is what tells the two
  # apart, so compose reports unhealthy instead of keeping a container in
  # rotation that can deliver nothing.
  gorge-mailer:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-mailer
        PORT: 8110
    image: ghcr.io/soulteary/gorge-mailer:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8110"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      # The backend list. Left at the "test" default the service is ready and
      # accepts mail, but delivers none of it; see .env.example.
      GORGE_MAILER_CONFIG: ${GORGE_MAILER_CONFIG:-[{"key":"test","type":"test"}]}
      GORGE_MAILER_MAX_RETRIES: ${GORGE_MAILER_MAX_RETRIES:-2}
      GORGE_MAILER_RETRY_WAIT: ${GORGE_MAILER_RETRY_WAIT:-2}
    ports:
      - "${GORGE_MAILER_PORT:-8110}:8110"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8110/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- gorge-search: fulltext indexing and search ---
  #
  # The second service on the mailer's side of the line: in-process state (a
  # per-host health table for the Elasticsearch fan-out), connections out to a
  # store this stack does not run, and a readiness condition worth reporting.
  #
  # No Elasticsearch or Meilisearch container is declared here on purpose. A
  # search cluster is storage — it has volumes, memory limits and an upgrade
  # path of its own — and burying one in the service layer's compose file would
  # make `docker compose down -v` a way to lose an index. Point
  # GORGE_SEARCH_BACKENDS at an instance you run separately.
  #
  # The healthcheck probes /readyz for the same reason the mailer's does, and
  # the state it catches is the same shape: a service with no readable backend
  # is listening, answers /healthz with 200, and fails every single query.
  # Readiness does not dial the cluster, so an unhealthy container here means
  # "misconfigured", never "Elasticsearch is having a moment".
  gorge-search:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-search
        PORT: 8120
    image: ghcr.io/soulteary/gorge-search:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8120"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      # The backend list. Left at the "test" default the service is ready and
      # accepts documents, but indexes them into memory and loses them on
      # restart; see .env.example, which is blunter about it.
      GORGE_SEARCH_BACKENDS: ${GORGE_SEARCH_BACKENDS:-[{"type":"test","roles":["read","write"]}]}
    ports:
      # PUBLISH_PORT, not PORT: this is the host side of the mapping only. The
      # phorge-fork orchestration uses GORGE_SEARCH_PORT for the *internal*
      # port its Phorge container dials, so sharing one .env between the two
      # repositories under the same name would silently conflate them.
      - "${GORGE_SEARCH_PUBLISH_PORT:-8120}:8120"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8120/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- gorge-file-storage: the bytes of Phorge's files ---
  #
  # Also a process of its own, and the only service here that can be given a
  # database. It is not given one in this stack: this compose file is the Go
  # service layer, with no Phorge and no MySQL, so the blob backend has nothing
  # to point at and stays off. Local disk is what makes the service usable on
  # its own, and a deployment alongside Phorge adds the MySQL settings — see
  # .env.example.
  #
  # The healthcheck probes /readyz for the same reason the mailer's does, plus
  # one of its own: with a database configured, /readyz is what reports the
  # database being unreachable. It deliberately does *not* report whether
  # Phorge's `file_storageblob` table exists — see docs/modules/file-storage.md
  # section 3.5 for why that check would deadlock a full stack.
  gorge-file-storage:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-file-storage
        PORT: 8100
    image: ghcr.io/soulteary/gorge-file-storage:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8100"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      # The in-container path, not a host path: it is where the volume below
      # is mounted. The image creates it owned by the unprivileged user, which
      # is what lets a fresh named volume be writable at all.
      GORGE_FILE_LOCAL_DISK_PATH: ${GORGE_FILE_LOCAL_DISK_PATH:-/var/lib/gorge/files}
      # Blank host = the blob backend is not registered. Point it at Phorge's
      # database to turn it on, and read the double-write warning in
      # compat/phorge/README.md section 8 first.
      GORGE_FILE_MYSQL_HOST: ${GORGE_FILE_MYSQL_HOST:-}
      GORGE_FILE_MYSQL_PORT: ${GORGE_FILE_MYSQL_PORT:-3306}
      GORGE_FILE_MYSQL_USER: ${GORGE_FILE_MYSQL_USER:-phorge}
      GORGE_FILE_MYSQL_PASS: ${GORGE_FILE_MYSQL_PASS:-}
      GORGE_FILE_NAMESPACE: ${GORGE_FILE_NAMESPACE:-phorge}
      GORGE_FILE_MYSQL_BLOB_MAX_SIZE: ${GORGE_FILE_MYSQL_BLOB_MAX_SIZE:-1000000}
      # All five S3 settings are required together, or the backend stays off.
      GORGE_FILE_S3_BUCKET: ${GORGE_FILE_S3_BUCKET:-}
      GORGE_FILE_S3_ACCESS_KEY: ${GORGE_FILE_S3_ACCESS_KEY:-}
      GORGE_FILE_S3_SECRET_KEY: ${GORGE_FILE_S3_SECRET_KEY:-}
      GORGE_FILE_S3_REGION: ${GORGE_FILE_S3_REGION:-}
      GORGE_FILE_S3_ENDPOINT: ${GORGE_FILE_S3_ENDPOINT:-}
      GORGE_FILE_INSTANCE_NAME: ${GORGE_FILE_INSTANCE_NAME:-}
    volumes:
      # Named rather than a bind mount, because the files have to outlive the
      # container and nothing on the host needs to read them.
      - gorge_files:/var/lib/gorge/files
    ports:
      - "${GORGE_FILE_STORAGE_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8100/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --- gorge-webhook: Herald webhook delivery ---
  #
  # The one service here that does not wait to be asked. Its work is a poll
  # loop over `{namespace}_herald.herald_webhookrequest` — the queue Phorge
  # fills — and every row it finds becomes an outbound POST to a third party's
  # endpoint. The HTTP listener is only status: two read-only counts, and the
  # probes below.
  #
  # That makes it the only service in this file with a hard external
  # dependency and no way to run without one. File storage can be given a
  # database or a local directory; search and mail have in-memory adapters.
  # This one has nothing to fall back to, because the database *is* the work —
  # which is also why it has no "not configured" state to report. Left
  # unconfigured in this stack it dials 127.0.0.1, which inside a container is
  # the container, and reports itself unready. That is the same answer it
  # would give for a database that is configured and down, and there is
  # nothing more useful to say: either way it delivers nothing.
  #
  # It also has to be deployed *instead of* Phorge's own delivery, not
  # alongside it. Two drains on one queue is not a scaling arrangement — it is
  # duplicate POSTs to somebody's endpoint — see compat/phorge/README.md.
  gorge-webhook:
    <<: *service-defaults
    build:
      context: ../../go
      dockerfile: Dockerfile
      args:
        SERVICE: gorge-webhook
        PORT: 8160
    image: ghcr.io/soulteary/gorge-webhook:${GORGE_IMAGE_TAG:-latest}
    environment:
      GORGE_LISTEN_ADDR: ":8160"
      GORGE_SERVICE_TOKEN: ${GORGE_SERVICE_TOKEN:-}
      # Unlike file storage's blob backend, a blank host does not switch
      # anything off — there is nothing here to switch off. It falls through to
      # 127.0.0.1 and the service sits unready until this points at the MySQL
      # holding the Phorge install's `{namespace}_herald` database.
      GORGE_WEBHOOK_MYSQL_HOST: ${GORGE_WEBHOOK_MYSQL_HOST:-}
      GORGE_WEBHOOK_MYSQL_PORT: ${GORGE_WEBHOOK_MYSQL_PORT:-3306}
      GORGE_WEBHOOK_MYSQL_USER: ${GORGE_WEBHOOK_MYSQL_USER:-phorge}
      GORGE_WEBHOOK_MYSQL_PASS: ${GORGE_WEBHOOK_MYSQL_PASS:-}
      # Selects the database as `{namespace}_herald`, so it has to match the
      # `storage.default-namespace` of the Phorge install being drained.
      GORGE_WEBHOOK_NAMESPACE: ${GORGE_WEBHOOK_NAMESPACE:-phorge}
      GORGE_WEBHOOK_POLL_INTERVAL_MS: ${GORGE_WEBHOOK_POLL_INTERVAL_MS:-1000}
      GORGE_WEBHOOK_DELIVERY_TIMEOUT: ${GORGE_WEBHOOK_DELIVERY_TIMEOUT:-15}
      GORGE_WEBHOOK_MAX_CONCURRENT: ${GORGE_WEBHOOK_MAX_CONCURRENT:-8}
      # The circuit breaker: 10 failures inside 5 minutes and a hook stops
      # being delivered to until they age out. Both are Phorge's numbers.
      GORGE_WEBHOOK_ERROR_BACKOFF_SEC: ${GORGE_WEBHOOK_ERROR_BACKOFF_SEC:-300}
      GORGE_WEBHOOK_ERROR_THRESHOLD: ${GORGE_WEBHOOK_ERROR_THRESHOLD:-10}
      GORGE_WEBHOOK_RETRY_BACKOFF_SEC: ${GORGE_WEBHOOK_RETRY_BACKOFF_SEC:-60}
      # How long a claimed request stays off other instances' lists. It is
      # raised to the delivery timeout automatically if set below it, since a
      # lease shorter than an attempt is a second delivery of the same row.
      GORGE_WEBHOOK_CLAIM_LEASE_SEC: ${GORGE_WEBHOOK_CLAIM_LEASE_SEC:-30}
    ports:
      - "${GORGE_WEBHOOK_PORT:-8160}:8160"
    healthcheck:
      # /readyz, and here the difference from /healthz is starker than
      # anywhere else in this file. A gorge-webhook that cannot reach its
      # database is listening, answers /healthz with 200, and delivers
      # nothing — with no failure visible anywhere, because Phorge keeps
      # queueing rows and they just sit there. Only this probe notices.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8160/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  gorge:
    driver: bridge

volumes:
  # The local disk backend's storage. Losing it loses every file written
  # through that backend: the handles stay in Phorge's database and resolve to
  # nothing, so the files are gone while the site still lists them.
  gorge_files:
